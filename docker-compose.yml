services:
  django:
    container_name: wpp-app
    build:
      context: .
      target: local
    ports:
      - "8000:8000"
    volumes:
      - .:/code
      - /code/node_modules
      - /venv
    env_file: .env
    environment:
      - DJANGO_ENV=local
      - DEBUG=True
    command: /bin/bash /code/deploy/start-local.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  bolt:
    container_name: wpp-api
    build:
      context: .
      target: local
    ports:
      - "8001:8001"
    volumes:
      - .:/code
      - /code/node_modules
      - /venv
    env_file: .env
    environment:
      - DJANGO_ENV=local
      - DEBUG=True
    command: python manage.py runbolt --dev --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/api/v1/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
