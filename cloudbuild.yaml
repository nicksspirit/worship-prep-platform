# Build → push → migrate → deploy Bolt → deploy Django and its API proxy.
# deploy/deploy.sh supplies the settings below.

substitutions:
  # Cloud Run and Artifact Registry.
  _REGION: us-central1
  _AR_REPOSITORY: wpp-registry
  _IMAGE_NAME: wpp-app
  _RUNTIME_SA: ""
  _DJANGO_SERVICE: wpp-app
  _BOLT_SERVICE: wpp-api
  _MIGRATE_JOB: wpp-migrate

  # Storage.
  _SUPABASE_STORAGE_BUCKET: ""
  _SUPABASE_CATALOG_IMPORT_BUCKET: ""
  _SUPABASE_S3_ENDPOINT: ""
  _SUPABASE_S3_REGION: us-east-1

  # Email.
  _EMAIL_HOST: ""
  _EMAIL_PORT: "587"
  _EMAIL_HOST_USER: ""
  _DEFAULT_FROM_EMAIL: ""

  # Web access.
  _ALLOWED_HOSTS: ".run.app,localhost,127.0.0.1"
  _CSRF_TRUSTED_ORIGINS: "https://*.run.app"

  # Shared deployment values. Escaped newlines keep each flag a single argument.
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${BUILD_ID}
  _SERVICE_ENV: "^|^DJANGO_ENV=prod|GCP_PROJECT_ID=${PROJECT_ID}|\
    SUPABASE_STORAGE_BUCKET=${_SUPABASE_STORAGE_BUCKET}|\
    SUPABASE_CATALOG_IMPORT_BUCKET=${_SUPABASE_CATALOG_IMPORT_BUCKET}|\
    SUPABASE_S3_ENDPOINT=${_SUPABASE_S3_ENDPOINT}|\
    SUPABASE_S3_REGION=${_SUPABASE_S3_REGION}|\
    EMAIL_HOST=${_EMAIL_HOST}|\
    EMAIL_PORT=${_EMAIL_PORT}|\
    EMAIL_HOST_USER=${_EMAIL_HOST_USER}|\
    DEFAULT_FROM_EMAIL=${_DEFAULT_FROM_EMAIL}|\
    ALLOWED_HOSTS=${_ALLOWED_HOSTS}"
  _SERVICE_SECRETS: "DATABASE_URL=DATABASE_URL:latest,\
    SECRET_KEY=SECRET_KEY:latest,\
    GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,\
    GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,\
    SUPABASE_S3_ACCESS_KEY=SUPABASE_S3_ACCESS_KEY:latest,\
    SUPABASE_S3_SECRET_KEY=SUPABASE_S3_SECRET_KEY:latest,\
    EMAIL_HOST_PASSWORD=EMAIL_HOST_PASSWORD:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/SUPABASE_S3_ACCESS_KEY/versions/latest
      env: SUPABASE_S3_ACCESS_KEY
    - versionName: projects/${PROJECT_ID}/secrets/SUPABASE_S3_SECRET_KEY/versions/latest
      env: SUPABASE_S3_SECRET_KEY

steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv:
      - SUPABASE_S3_ACCESS_KEY
      - SUPABASE_S3_SECRET_KEY
    env:
      - DOCKER_BUILDKIT=1
    args:
      - -ceu
      - |
        docker build \
          -f docker/Dockerfile \
          --target=prod \
          --build-arg=SUPABASE_STORAGE_BUCKET=${_SUPABASE_STORAGE_BUCKET} \
          --build-arg=SUPABASE_CATALOG_IMPORT_BUCKET=${_SUPABASE_CATALOG_IMPORT_BUCKET} \
          --build-arg=SUPABASE_S3_ENDPOINT=${_SUPABASE_S3_ENDPOINT} \
          --build-arg=SUPABASE_S3_ACCESS_KEY="$$SUPABASE_S3_ACCESS_KEY" \
          --build-arg=SUPABASE_S3_SECRET_KEY="$$SUPABASE_S3_SECRET_KEY" \
          --build-arg=SUPABASE_S3_REGION=${_SUPABASE_S3_REGION} \
          -t ${_IMAGE} \
          .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}

  - id: deploy-migrate-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_MIGRATE_JOB}
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-secrets=DIRECT_URL=DIRECT_URL:latest,SECRET_KEY=SECRET_KEY:latest
      - --command=/bin/bash
      - --args=deploy/start-migrate.sh
      - --max-retries=1
      - --tasks=1

  - id: run-migrate-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - ${_MIGRATE_JOB}
      - --region=${_REGION}
      - --wait

  - id: deploy-bolt
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_BOLT_SERVICE}
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --allow-unauthenticated
      - --port=8080
      - --timeout=600
      - --use-http2
      # A valid 120.6 MiB import peaked at 664 MiB RSS before container storage.
      - --memory=2Gi
      - --concurrency=1
      - --set-env-vars=${_SERVICE_ENV}
      - --set-secrets=${_SERVICE_SECRETS}
      - --command=/bin/bash
      - --args=deploy/start-bolt.sh

  - id: deploy-django
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        bolt_url="$$(gcloud run services describe ${_BOLT_SERVICE} \
          --region=${_REGION} --format='value(status.url)')"
        gcloud run deploy ${_DJANGO_SERVICE} \
          --image=${_IMAGE} \
          --region=${_REGION} \
          --service-account=${_RUNTIME_SA} \
          --allow-unauthenticated \
          --port=8080 \
          --timeout=600 \
          --use-http2 \
          --set-env-vars="${_SERVICE_ENV}|CSRF_TRUSTED_ORIGINS=${_CSRF_TRUSTED_ORIGINS}|BOLT_UPSTREAM_URL=$$bolt_url" \
          --set-secrets=${_SERVICE_SECRETS} \
          --command=/bin/bash \
          --args=deploy/start-django.sh

images:
  - ${_IMAGE}
