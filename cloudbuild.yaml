# Cloud Build: build prod image, push to Artifact Registry, run migrations (Job), deploy services.
#
# Deployment keys, defaults, runtime env vars, and runtime secrets live in
# deploy/config.sh. This file is only the Cloud Build step graph.

options:
  logging: CLOUD_LOGGING_ONLY
  automapSubstitutions: true

availableSecrets:
  secretManager:
    # Build-time secrets must be exposed here so Cloud Build can mount them
    # into the docker builder. Runtime secret names live in deploy/config.sh.
    - versionName: projects/${PROJECT_ID}/secrets/SUPABASE_S3_ACCESS_KEY/versions/latest
      env: SUPABASE_S3_ACCESS_KEY
    - versionName: projects/${PROJECT_ID}/secrets/SUPABASE_S3_SECRET_KEY/versions/latest
      env: SUPABASE_S3_SECRET_KEY

steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv:
      - SUPABASE_S3_ACCESS_KEY
      - SUPABASE_S3_SECRET_KEY
    env:
      - DOCKER_BUILDKIT=1
    args:
      - -ceu
      - ./deploy/cloudbuild.sh build-image

  - id: push-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - ./deploy/cloudbuild.sh push-image

  - id: deploy-migrate-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - ./deploy/cloudbuild.sh deploy-migrate-job

  - id: run-migrate-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - ./deploy/cloudbuild.sh run-migrate-job

  - id: deploy-django
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - ./deploy/cloudbuild.sh deploy-django

  - id: deploy-bolt
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - ./deploy/cloudbuild.sh deploy-bolt
