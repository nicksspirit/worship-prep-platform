services:
  django:
    container_name: wpp-app
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ..:/code
      - /code/node_modules
      - /venv
    env_file: ../.env
    environment:
      - DJANGO_ENV=local
      - DEBUG=True
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025
      - EMAIL_USE_TLS=false
      - EMAIL_HOST_USER=
      - EMAIL_HOST_PASSWORD=
    depends_on:
      - mailpit
    command: /bin/bash /code/deploy/start-local.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  bolt:
    container_name: wpp-api
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ..:/code
      - /code/node_modules
      - /venv
    env_file: ../.env
    environment:
      - DJANGO_ENV=local
      - DEBUG=True
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025
      - EMAIL_USE_TLS=false
      - EMAIL_HOST_USER=
      - EMAIL_HOST_PASSWORD=
    depends_on:
      - mailpit
    command: python manage.py runbolt --dev --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/api/v1/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
