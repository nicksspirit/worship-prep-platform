[project]
name = "worship-prep-platform"
version = "0.1.0"
description = "Publish a read-only Song Catalog sourced from the EasyWorship Library."
readme = "README.md"
requires-python = ">=3.13.5"
dependencies = [
    "django>=5.2.8",
    "django-allauth[socialaccount]>=65.13.0",
    "django-bolt>=0.6.0",
    "django-health-check>=3.20.0",
    "django-stubs-ext>=5.2.7",
    "django-structlog>=9.1.0",
    "django-unfold>=0.71.0",
    "whitenoise>=6.9.0",
    "environs[django]>=14.5.0",
    "psycopg[binary]>=3.3.2",
    "reactivated>=0.47.8",
    "django-invitations>=2.1.0",
    "django-split-settings>=1.3.2",
    "jsonschema>=4.25.1",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2.7",
    "easy-django-cli>=0.2.0",
]
local = [
    { include-group = "dev" },
]
prod = [
    "django-storages[boto3]>=1.14.6",
    "gunicorn>=23.0.0",
]
test = [
    "httpx>=0.28.1",
    "pytest>=8.4.0",
    "pytest-django>=4.11.0",
    "testcontainers[postgres]>=4.0.0",
    { include-group = "dev" },
]


[tool.mypy]
plugins = ["mypy_django_plugin.main"]


[tool.django-stubs]
django_settings_module = "backend.settings"


[tool.basedpyright]
reportImplicitStringConcatenation = "none"


[tool.ruff]
line-length = 90
target-version = "py313"


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["apps"]


[tool.poe]
executor = "uv"

[tool.poe.tasks]
manage = "python manage.py"
test = { cmd = "pytest", env = { DJANGO_ENV = "test" }, help = "Run test suite (requires Docker)" }
dev = "python manage.py runserver 8001"
bolt = "python manage.py runbolt --dev"
makemig = "python manage.py makemigrations"
migrate = "python manage.py migrate"

[tool.poe.tasks.deploy]
help = "Deploy the app and API to Cloud Run"
cmd = "./deploy/deploy.sh"

[tool.pyrefly]
untyped_def_behavior = "skip-and-infer-return-any"
