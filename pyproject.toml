[project]
name = "worship-prep-platform"
version = "0.1.0"
description = "Keep lyrics, verses, and slides in sync with real-time reviews, publishing, and EasyWorship control."
readme = "README.md"
requires-python = ">=3.13.5"
dependencies = [
    "django>=5.2.8",
    "django-allauth[socialaccount]>=65.13.0",
    "django-bolt>=0.6.0",
    "django-cors-headers>=4.9.0",
    "django-health-check>=3.20.0",
    "django-stubs-ext>=5.2.7",
    "django-structlog>=9.1.0",
    "django-typer>=3.4.0",
    "django-unfold>=0.71.0",
    "whitenoise>=6.9.0",
    "environs[django]>=14.5.0",
    "psycopg[binary]>=3.3.2",
    "reactivated>=0.47.8",
    "django-invitations>=2.1.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2.7",
    "easy-django-cli>=0.2.0",
]
local = [
    { include-group = "dev" },
]
prod = [
    "django-storages[boto3]>=1.14.6",
    "gunicorn>=23.0.0",
]
test = [
    "pytest>=8.4.0",
    "pytest-django>=4.11.0",
    { include-group = "dev" },
]


[tool.mypy]
plugins = ["mypy_django_plugin.main"]


[tool.django-stubs]
django_settings_module = "backend.settings"


[tool.basedpyright]
reportImplicitStringConcatenation = "none"


[tool.ruff]
line-length = 90
target-version = "py313"


[tool.poe]
executor = "uv"

[tool.poe.tasks]
manage = "python manage.py"
dev = "python manage.py runserver"
bolt = "python manage.py runbolt --dev"
makemig = "python manage.py makemigrations"
migrate = "python manage.py migrate"

[tool.poe.tasks.deploy]
help = "Deploy the app and API to Cloud Run"
shell = """
if [ -f .env ]; then
  set -a
  . ./.env
  set +a
fi
export GCP_PROJECT_ID="${GCP_PROJECT_ID:-worship-prep-portal}"
export GCP_REGION="${GCP_REGION:-us-west1}"
export RUNTIME_SA="${RUNTIME_SA:-wpp-runtime@worship-prep-portal.iam.gserviceaccount.com}"
export SUPABASE_STORAGE_BUCKET="${SUPABASE_STORAGE_BUCKET:-wpp-media}"
if [ -z "${SUPABASE_S3_ENDPOINT:-}" ] && [ -n "${SUPABASE_URL:-}" ]; then
  export SUPABASE_S3_ENDPOINT="${SUPABASE_URL%/}/storage/v1/s3"
fi
export SUPABASE_S3_REGION="${SUPABASE_S3_REGION:-us-east-1}"
./deploy/deploy.sh
"""

[tool.pyrefly]
untyped_def_behavior = "skip-and-infer-return-any"
