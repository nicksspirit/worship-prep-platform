name: Catalog Exporter

on:
  pull_request:
    paths:
      - ".github/workflows/catalog-exporter.yml"
      - "contracts/catalog-import/**"
      - "exporter/**"
      - "static/install-catalog-exporter.ps1"
  push:
    branches: [main]
    tags: ["exporter/v*"]
    paths:
      - ".github/workflows/catalog-exporter.yml"
      - "contracts/catalog-import/**"
      - "exporter/**"
      - "static/install-catalog-exporter.ps1"

permissions:
  contents: read

jobs:
  portable-tests:
    name: Portable tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: exporter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: exporter/go.sum
      - run: go test ./...
        env:
          CGO_ENABLED: "0"
      - run: go vet ./...
        env:
          CGO_ENABLED: "0"

  windows-cross-compile:
    name: Windows no-CGO cross-compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exporter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: exporter/go.sum
      - run: go build -trimpath -o dist/catalog-exporter.exe ./cmd/catalog-exporter
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64

  windows-installer:
    name: Windows installer and Task Scheduler contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer commands and syntax
        shell: pwsh
        run: ./static/install-catalog-exporter.ps1 -Mode Validate
      - name: Assert weekly Pacific retry policy
        shell: pwsh
        run: |
          $installer = Get-Content ./static/install-catalog-exporter.ps1 -Raw
          foreach ($required in @(
            'Pacific Standard Time',
            'New-ScheduledTaskTrigger -Weekly',
            '-At "03:00"',
            '-RestartCount 1',
            'New-TimeSpan -Minutes 30',
            'DataProtectionScope]::CurrentUser'
          )) {
            if (-not $installer.Contains($required)) {
              throw "Installer contract is missing: $required"
            }
          }
          $pacific = [TimeZoneInfo]::FindSystemTimeZoneById('Pacific Standard Time')
          $winter = $pacific.GetUtcOffset([datetime]'2026-01-15T03:00:00')
          $summer = $pacific.GetUtcOffset([datetime]'2026-07-15T03:00:00')
          if ($winter -eq $summer) {
            throw 'Pacific schedule does not exhibit the required DST transition.'
          }

  windows-easyworship-smoke:
    name: Real EasyWorship Windows acquisition smoke
    if: startsWith(github.ref, 'refs/tags/exporter/v')
    runs-on: [self-hosted, Windows, X64, easyworship]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: exporter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: exporter/go.sum
      - name: Acquire real EasyWorship source and build package
        shell: pwsh
        env:
          EASYWORSHIP_DATA_DIR: ${{ vars.WPP_EASYWORSHIP_DATA_DIR }}
        run: |
          if (-not $env:EASYWORSHIP_DATA_DIR) {
            throw 'Repository variable WPP_EASYWORSHIP_DATA_DIR is required.'
          }
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'wpp-easyworship-smoke'
          Remove-Item $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          try {
            go run ./cmd/catalog-exporter `
              --data-dir $env:EASYWORSHIP_DATA_DIR `
              --state-dir $smokeRoot `
              --instance-id ([guid]::NewGuid().ToString()) `
              --run-id ([guid]::NewGuid().ToString())
            $package = Get-ChildItem (Join-Path $smokeRoot 'packages') -Filter '*.zip'
            if ($package.Count -ne 1 -or $package[0].Length -le 0) {
              throw 'Real EasyWorship acquisition did not produce one package.'
            }
          }
          finally {
            Remove-Item $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

  release:
    name: Publish checksum-verified Windows release
    if: startsWith(github.ref, 'refs/tags/exporter/v')
    needs:
      - portable-tests
      - windows-cross-compile
      - windows-installer
      - windows-easyworship-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: exporter/go.sum
      - name: Build Windows artifact
        working-directory: exporter
        run: |
          VERSION="${GITHUB_REF_NAME#exporter/v}"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o dist/catalog-exporter.exe \
            ./cmd/catalog-exporter
          cd dist
          sha256sum catalog-exporter.exe > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          exporter/dist/catalog-exporter.exe
          exporter/dist/checksums.txt
          --verify-tag
          --generate-notes
          --title "Catalog Exporter ${GITHUB_REF_NAME#exporter/v}"
