name: Catalog Exporter

on:
  pull_request:
    paths:
      - ".github/workflows/catalog-exporter.yml"
      - "contracts/catalog-import/**"
      - "exporter/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-exporter.yml"
      - "contracts/catalog-import/**"
      - "exporter/**"

permissions:
  contents: read

jobs:
  portable-tests:
    name: Portable tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: exporter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: exporter/go.sum
      - run: go test ./...
        env:
          CGO_ENABLED: "0"
      - run: go vet ./...
        env:
          CGO_ENABLED: "0"

  windows-cross-compile:
    name: Windows no-CGO cross-compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exporter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: exporter/go.sum
      - run: go build -trimpath -o dist/catalog-exporter.exe ./cmd/catalog-exporter
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
