name: API routing

on:
  pull_request:
    paths:
      - "deploy/start-django.sh"
      - "deploy/nginx.conf.template"
      - "deploy/nginx-bolt.conf.template"
      - "deploy/nginx-logging.conf.template"
      - "deploy/start-bolt.sh"
      - "deploy/install-nginx.sh"
      - "deploy/supervise.sh"
      - "docker/Dockerfile"
      - "docker/Dockerfile.proxy-test"
      - "cloudbuild.yaml"
      - "tests/integration/test_api_proxy.py"
      - "tests/integration/test_large_imports.py"
      - "tests/integration/proxy_fixture.py"
      - "exporter/tests/deliver-fixture/**"
      - "tests/integration/test_shutdown.py"
      - "apps/common/**"
      - "apps/catalog/api.py"
      - "backend/gunicorn.py"
      - "backend/settings/components/logging.py"
      - ".github/workflows/api-routing.yml"
  push:
    branches: [main]
    paths:
      - "deploy/start-django.sh"
      - "deploy/nginx.conf.template"
      - "deploy/nginx-bolt.conf.template"
      - "deploy/nginx-logging.conf.template"
      - "deploy/start-bolt.sh"
      - "deploy/install-nginx.sh"
      - "deploy/supervise.sh"
      - "docker/Dockerfile"
      - "docker/Dockerfile.proxy-test"
      - "cloudbuild.yaml"
      - "tests/integration/test_api_proxy.py"
      - "tests/integration/test_large_imports.py"
      - "tests/integration/proxy_fixture.py"
      - "exporter/tests/deliver-fixture/**"
      - "tests/integration/test_shutdown.py"
      - "apps/common/**"
      - "apps/catalog/api.py"
      - "backend/gunicorn.py"
      - "backend/settings/components/logging.py"
      - ".github/workflows/api-routing.yml"

permissions:
  contents: read

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the production-compatible HTTP/2 fixture
        run: docker build -f docker/Dockerfile.proxy-test -t wpp-http2-test .
      - name: Check routing and streamed imports
        run: docker run --rm wpp-http2-test python tests/integration/test_api_proxy.py
      - name: Check structured Django and Gunicorn logs
        run: docker run --rm --user 1000:1000 wpp-http2-test python manage.py test apps.common.tests.test_request_logging --noinput
      - name: Check graceful shutdown and child cleanup
        run: docker run --rm --user 1000:1000 wpp-http2-test python tests/integration/test_shutdown.py
      - name: Start disposable importer PostgreSQL
        run: |
          docker network create wpp-http2-tests
          docker run -d --name wpp-http2-postgres --network wpp-http2-tests \
            -e POSTGRES_PASSWORD=http2-fixture -e POSTGRES_DB=http2_fixture postgres:16-alpine
          for attempt in $(seq 1 30); do
            if docker exec wpp-http2-postgres pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Check real exporter delivery and importer limits through both services
        run: >-
          docker run --rm --user 1000:1000 --network wpp-http2-tests
          -e WPP_HTTP2_TEST_DATABASE_URL=postgresql://postgres:http2-fixture@wpp-http2-postgres:5432/http2_fixture
          wpp-http2-test
      - name: Remove temporary database
        if: always()
        run: |
          docker rm -f wpp-http2-postgres || true
          docker network rm wpp-http2-tests || true
