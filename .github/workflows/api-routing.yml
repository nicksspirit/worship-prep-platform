name: API routing

on:
  pull_request:
    paths:
      - "deploy/start-django.sh"
      - "deploy/nginx.conf.template"
      - "docker/Dockerfile"
      - "cloudbuild.yaml"
      - "tests/integration/test_api_proxy.py"
      - "tests/integration/test_shutdown.py"
      - "apps/common/**"
      - "apps/catalog/api.py"
      - "backend/gunicorn.py"
      - "backend/settings/components/logging.py"
      - ".github/workflows/api-routing.yml"
  push:
    branches: [main]
    paths:
      - "deploy/start-django.sh"
      - "deploy/nginx.conf.template"
      - "docker/Dockerfile"
      - "cloudbuild.yaml"
      - "tests/integration/test_api_proxy.py"
      - "tests/integration/test_shutdown.py"
      - "apps/common/**"
      - "apps/catalog/api.py"
      - "backend/gunicorn.py"
      - "backend/settings/components/logging.py"
      - ".github/workflows/api-routing.yml"

permissions:
  contents: read

jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install project runtime
        run: uv sync --group test --group prod --frozen
      - name: Install Nginx
        run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Stop the packaged default server
        run: sudo systemctl stop nginx
      - name: Check routing and streamed imports
        # The Cloud Run origin test binds the default HTTPS port 443.
        run: sudo "$PWD/.venv/bin/python" tests/integration/test_api_proxy.py
      - name: Check structured Django and Gunicorn logs
        run: .venv/bin/python manage.py test apps.common.tests.test_request_logging --noinput
        env:
          DJANGO_ENV: test
      - name: Check graceful shutdown and child cleanup
        # Both suites render the same Nginx config and temporary directories.
        run: sudo env PATH="$PWD/.venv/bin:$PATH" "$PWD/.venv/bin/python" tests/integration/test_shutdown.py
